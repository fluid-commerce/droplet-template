# Builds and deploys the Next app as its OWN Cloud Run service.
#
#   gcloud beta builds submit --config cloudbuild-next.yml --region=us-west3 \
#     --substitutions=COMMIT_SHA=$(git rev-parse --short HEAD),_TIMESTAMP=$(date +%Y%m%d%H%M%S) \
#     --project=fluid-417204 .
#
# Deliberately a SEPARATE service (`${_APP_NAME}-next`) rather than another
# revision of the Rails one. Nothing routes to it by hostname: Fluid calls
# whatever url is recorded in each installation's callback and webhook
# registrations, so this service receives no traffic at all until an
# installation is repointed at it. That makes deploying it inert, and makes
# cutover a per-company decision rather than a percentage.
#
# There is no migrations step, and there must not be. Rails owns this schema;
# the Next app maps onto the same tables and treats them as read-shaped. Two
# migration tools against one database is how you get a schema neither app
# agrees with.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
        ".",
        "-f",
        "Dockerfile.next",
      ]
    id: build

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "tag",
        "us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
        "us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:latest",
      ]
    id: tag

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
      ]
    id: push commit sha

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:latest",
      ]
    id: push latest

  # `services update` rather than `deploy`: the service is created once, by
  # hand, carrying the same DATABASE_URL and Fluid credentials as the Rails
  # service plus its own FLUID_DROPLET_URL. Keeping creation out of the pipeline
  # means this step cannot invent configuration, and a service that does not
  # exist yet fails loudly here instead of coming up misconfigured.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      [
        "run",
        "services",
        "update",
        "${_APP_NAME}-next",
        "--platform=managed",
        "--image=us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA",
        "--region=us-west3",
        "--revision-suffix=${COMMIT_SHA}-${_TIMESTAMP}",
      ]
    id: deploy next
    entrypoint: gcloud

substitutions:
  _APP_NAME: "fluid-droplet-NAME"
  _APP_REPOSITORY: "fluid-droplets"

images:
  - "us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:$COMMIT_SHA"
  - "us-west3-docker.pkg.dev/${PROJECT_ID}/${_APP_REPOSITORY}/${_APP_NAME}-next/web:latest"

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
