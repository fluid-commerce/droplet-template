# Deploys the Next app to its own Cloud Run service.
#
# workflow_dispatch only, like the Rails deploy. Deliberate: this service takes
# no traffic until an installation's registrations are repointed at it, so
# deploying it is safe — but that also means an automatic deploy on merge would
# quietly move the thing a cutover is measured against. Cutovers are decided,
# not triggered.
name: deploy next

on:
  workflow_dispatch:

env:
  PROJECT_ID: fluid-417204
  CLUIDBUILD_FILE: cloudbuild-next.yml

jobs:
  cloudbuild:
    name: build and deploy the Next service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_JSON }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 475.0.0"
          skip_install: true
          project_id: ${{ env.PROJECT_ID }}

      - name: Install grpcio and set environment variable
        run: |
          pip install grpcio
          echo "CLOUDSDK_PYTHON_SITEPACKAGES=1" >> $GITHUB_ENV

      - name: Submit Cloud Build
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          gcloud beta builds submit --config ${{ env.CLUIDBUILD_FILE }} --region=europe-west1 --substitutions=COMMIT_SHA=${GITHUB_SHA::7},_TIMESTAMP=$TIMESTAMP --project ${{ env.PROJECT_ID }}
